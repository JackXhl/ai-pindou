# 爱拼豆 Web 免费版 —— Nginx 站点配置
#
# 部署形态：纯静态站，前置 Cloudflare 做 CDN 与 HTTPS。
# 多服务共存策略：同一台服务器的 Nginx 靠 server_name 区分不同服务，
# 各服务互不干扰，且本站根路径就是 /，不引入 basePath 的一系列坑。
#
# 安装：复制到 /etc/nginx/conf.d/pindou.conf，改掉 server_name 与 root，
# 然后 nginx -t 校验，再 systemctl reload nginx。

# ---------------------------------------------------------------------------
# 恢复 Cloudflare 回源的访问者真实 IP
# 不配这段的话，日志里全是 Cloudflare 的边缘节点 IP，限流与统计都会失真。
# IP 段会变动，建议用 cron 定期从 https://www.cloudflare.com/ips/ 拉取更新。
# ---------------------------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# HTTP 一律跳 HTTPS。Cloudflare 侧建议同时开启 Always Use HTTPS，
# 这里保留是为了防止有人绕过 CDN 直接访问源站。
server {
    listen 80;
    listen [::]:80;
    server_name pindou.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name pindou.example.com;
    root /var/www/pindou;
    index index.html;

    # 证书建议使用 Cloudflare Origin CA（有效期 15 年，仅供 CF 回源使用）。
    # 若用 Let's Encrypt，则由 certbot 自动改写下面两行。
    ssl_certificate     /etc/nginx/ssl/pindou/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/pindou/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_pindou:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    charset utf-8;
    access_log /var/log/nginx/pindou.access.log;
    error_log  /var/log/nginx/pindou.error.log;

    # 上传的图片全在浏览器本地处理，不经过服务端，这里只需容纳静态资源请求。
    client_max_body_size 1m;

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff font/woff2;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- 缓存策略 ----
    # 关键点：带内容指纹的构建产物可以长缓存，HTML 绝不能长缓存，
    # 否则发布新版本后用户会一直拿到旧页面引用已删除的旧资源。

    # Astro 构建产物带哈希文件名，可安全地永久缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # 字体与图片
    location ~* \.(woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # HTML 与数据文件：始终回源校验，保证发版即时生效
    location ~* \.(html|json|xml|txt)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Service Worker 必须每次校验，否则 PWA 更新会被卡住
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # ---- 路由 ----
    # 站点配置了 trailingSlash: 'always'，构建产物是目录形式（/palette/mard/index.html），
    # 因此 $uri/ 这一档是必需的。
    location / {
        try_files $uri $uri/ /404.html;
    }

    # 预留：将来若拆出独立后端服务，在同一子域名下走 /api 前缀反代，
    # 这样不产生跨域，前端也不必改任何 URL 逻辑。
    # location /api/ {
    #     proxy_pass http://127.0.0.1:3001/;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    error_page 404 /404.html;
}
